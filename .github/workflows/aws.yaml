name: CI-CD Pipeline for Vehicle Insurance App

on:
  push:
    branches: [ "main" ] # Runs on every push to the main branch

jobs:
  # -----------------------------------------------
  # Job 1: Build and Push Image to ECR
  # -----------------------------------------------
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest # Use a GitHub-hosted runner

    steps:
    - name: 1. Check out code
      uses: actions/checkout@v3

    - name: 2. Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

    - name: 3. Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: 4. Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPO_NAME }} # e.g., "vehicle-insurance-app"
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # -----------------------------------------------
  # Job 2: Deploy to EC2
  # -----------------------------------------------
  deploy:
    name: Deploy to EC2
    needs: build-and-push # This job waits for the first one to finish
    runs-on: ubuntu-latest # Also runs on a GitHub runner

    steps:
    - name: 1. SSH into EC2 and run deployment script
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}             # Your EC2's public IP
        username: ${{ secrets.EC2_USERNAME }}       # e.g., "ec2-user"
        key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}   # The .pem key to log in
        port: 22                                 # Default SSH port
        script: |
          cd /home/ec2-user/app  # Go to the app directory
          bash deploy.sh         # Run the deployment script